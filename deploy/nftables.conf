#!/usr/sbin/nft -f
#
# Deny forwarding between the control plane and every other bridge, in both directions.
# `internal: true` already removes the gateway; this is the belt to that braces, because
# the Docker daemon owns the FORWARD chain and its defaults change between releases.
#
# Bridge names are pinned in compose.yaml (com.docker.network.bridge.name) so these rules
# do not depend on dynamic interface names.
#
# Load:  sudo nft -f deploy/nftables.conf
# Check: sudo nft list chain inet agenttools forward

table inet agenttools {
	chain forward {
		type filter hook forward priority -5; policy accept;

		# the only permitted crossing: the proxy's authz listener.
		iifname "br-at-authz" oifname "br-at-cp" tcp dport 8444 accept

		# no forwarding at all into the control plane network
		iifname != "br-at-cp" oifname "br-at-cp" drop
		# and none out of it
		iifname "br-at-cp" oifname != "br-at-cp" drop

		# the authz bridge may only speak to the control plane and the proxy
		iifname "br-at-authz" oifname != "br-at-cp" drop
	}
}
