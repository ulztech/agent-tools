name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify
        run: npm run verify

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed keys and access tokens
        run: |
          set -euo pipefail
          if grep -rnE 'dbg_[A-Za-z0-9_-]{24,}|BEGIN (RSA |EC )?PRIVATE KEY' \
               --include='*.js' --include='*.json' --include='*.yml' --include='*.md' \
               --exclude-dir=node_modules . ; then
            echo "::error::possible secret committed"
            exit 1
          fi
          echo "no obvious secrets"

  no-real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixtures must be synthetic
        run: |
          set -euo pipefail
          if grep -rnE '[0-9]{2}-[0-9]{7}-[0-9]' test/ ; then
            echo "::warning::SSS-number-shaped value in fixtures — confirm it is synthetic"
          fi
          echo "fixture scan complete"
